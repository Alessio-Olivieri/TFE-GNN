[project]
name = "tfe-gnn-encrypted-traffic-ablation"
version = "0.1.0"
description = "Reproducible payload and TLS ciphertext ablations with a PyG adaptation of TFE-GNN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scapy==2.6.1",
    "scikit-learn==1.6.1",
    "torch==2.7.1",
    "torch-geometric==2.6.1",
    "psutil==7.0.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "experiments*"]
